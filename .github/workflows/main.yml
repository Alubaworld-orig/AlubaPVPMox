name: Build AlubaPVPMod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          # Если файла gradlew нет, мы его создадим прямо здесь
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 7.4.2
          fi
          chmod +x gradlew
          ./gradlew build
          
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: AlubaPVPMod-File
          path: build/libs/*.jar
